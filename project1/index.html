<!DOCTYPE html>
<html lang="en">
<head>
<title>Counter App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#87CEEB;
}

.container{
    width:350px;
    padding:30px;
    background:#fff;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:20px;
}

#counter{
    font-size:60px;
    margin:20px 0;
    font-weight:bold;
}

button{
    padding:10px 20px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

#increase{
    background:green;
}

#decrease{
    background:red;
}

#reset{
    background:orange;
}

button:hover{
    opacity:0.8;
}
</style>

</head>
<body>

<div class="container">
    <h1>Counter App</h1>

    <div id="counter">0</div>

    <button id="increase">+1</button>
    <button id="decrease">-1</button>
    <button id="reset">Reset</button>
</div>

<script>
let count = 0;

const counter = document.getElementById("counter");

document.getElementById("increase").addEventListener("click", function(){
    count++;
    counter.innerHTML = count;
});

document.getElementById("decrease").addEventListener("click", function(){
    count--;
    counter.innerHTML = count;
});

document.getElementById("reset").addEventListener("click", function(){
    count = 0;
    counter.innerHTML = count;
});
</script>

</body>
</html>
