<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Profile Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#87CEEB;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.card{
    display:none;
    margin-top:20px;
    padding:20px;
    border:2px solid #007BFF;
    border-radius:10px;
    background:#F5FAFF;
    text-align:center;
}

.avatar{
    font-size:60px;
    margin-bottom:10px;
}

.card p{
    margin:10px 0;
    font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<h1>Student Profile Card</h1>

<form autocomplete="off">

<label>Student Name</label>
<input type="text" id="name" placeholder="Enter Student Name">

<label>Roll Number</label>
<input type="text" id="roll" placeholder="Enter Roll Number">

<label>Marks</label>
<input type="number" id="marks" placeholder="Enter Marks">

<button type="button" onclick="displayProfile()">Display Profile</button>

</form>

<div class="card" id="profileCard">

<h2>Student Profile</h2>

<div class="avatar"></div>

<p><b>Name :</b> <span id="displayName"></span></p>

<p><b>Roll Number :</b> <span id="displayRoll"></span></p>

<p><b>Marks :</b> <span id="displayMarks"></span></p>

<p><b>Grade :</b> <span id="displayGrade"></span></p>

</div>

</div>

<script>

function displayProfile(){

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = Number(document.getElementById("marks").value);

    if(name=="" || roll=="" || document.getElementById("marks").value==""){
        alert("Please enter all the details.");
        return;
    }
    if(marks < 0 || marks > 100){
    alert("Invalid input");
    return;
}

    let grade;

    if(marks>=90)
        grade="A+";
    else if(marks>=80)
        grade="A";
    else if(marks>=70)
        grade="B";
    else if(marks>=60)
        grade="C";
    else if(marks>=50)
        grade="D";
    else
        grade="Fail";

    document.getElementById("displayName").innerHTML = name;
    document.getElementById("displayRoll").innerHTML = roll;
    document.getElementById("displayMarks").innerHTML = marks;
    document.getElementById("displayGrade").innerHTML = grade;

    document.getElementById("profileCard").style.display = "block";
}

</script>

</body>
</html>
